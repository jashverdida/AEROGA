spring.application.name=aeroga
server.port=8080

# MongoDB — override with environment variable in production
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aeroga}
spring.data.mongodb.database=aeroga

# Embedded MongoDB version (used when MONGODB_URI is not set)
de.flapdoodle.mongodb.embedded.version=7.0.0

# JWT
aeroga.jwt.secret=${JWT_SECRET:aeroga-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm}
aeroga.jwt.expiration=86400000

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.verpto.aeroga=DEBUG
